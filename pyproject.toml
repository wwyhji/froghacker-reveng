[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "froghacker-reveng"
version = "0.1.0"
description = "蛙客逆向关联追踪引擎开源版 — 关联图建模 / 游标导航 / 非注入 dump"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "FrogHacker (wwyhji)" }]
keywords = ["security", "reverse-engineering", "apk", "memory-dump"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # 纯标准库，零第三方依赖

[project.urls]
Homepage = "https://github.com/wwyhji/froghacker-reveng"
